<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>GHTrend · 正在启动</title>
<style>
  :root {
    --bg: #f6f8fa;
    --surface: #ffffff;
    --border: #d8dee4;
    --text: #1f2328;
    --muted: #656d76;
    --accent: #0969da;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
                 "Microsoft YaHei", sans-serif;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    -webkit-user-select: none;
    user-select: none;
  }
  .box {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    padding: 44px 54px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    min-width: 340px;
  }
  .logo {
    width: 46px;
    height: 46px;
    border-radius: 12px;
    background: linear-gradient(135deg, #0969da, #218bff);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 22px;
    font-weight: 700;
  }
  .title { font-size: 16px; font-weight: 600; letter-spacing: .3px; }
  .hint { font-size: 13px; color: var(--muted); }
  .bar {
    width: 190px;
    height: 3px;
    background: #eaeef2;
    border-radius: 2px;
    overflow: hidden;
  }
  .bar::after {
    content: "";
    display: block;
    width: 40%;
    height: 100%;
    background: var(--accent);
    border-radius: 2px;
    animation: slide 1.15s ease-in-out infinite;
  }
  @keyframes slide {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(300%); }
  }
</style>
</head>
<body>
  <div class="box">
    <div class="logo">★</div>
    <div class="title">GHTrend · GitHub 星速榜</div>
    <div class="bar"></div>
    <div class="hint">正在启动本地数据服务…</div>
  </div>
</body>
</html>
