name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# 新建仓库的 GITHUB_TOKEN 默认只读，创建 Release / 上传附件会 403。
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      # 构建机默认 cp1252 控制台，中文/emoji 输出会 UnicodeEncodeError
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python --version

      # 注意：--specpath 会让 --icon / --add-data 的相对路径按 spec 目录解析，
      # 因此这里一律传绝对路径（$ROOT）。失败时把日志写进 step summary，便于排查。
      - name: Build Python backend
        shell: bash
        run: |
          set -uo pipefail
          ROOT="$(pwd -W 2>/dev/null || pwd)"
          echo "ROOT=$ROOT"

          if ! python tools/make_icon.py > icon.log 2>&1; then
            {
              echo "### ❌ make_icon.py failed"
              echo '```'
              cat icon.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          ls -l "$ROOT/electron/build/icon.ico"

          if ! python -m PyInstaller --noconfirm --clean \
            --name ghtrend-server --onedir --noconsole \
            --icon "$ROOT/electron/build/icon.ico" \
            --add-data "$ROOT/web;web" \
            --distpath "$ROOT/backend-dist" \
            --workpath "$ROOT/build/pyinstaller" \
            --specpath "$ROOT/build" \
            "$ROOT/server.py" > pyi.log 2>&1; then
            {
              echo "### ❌ PyInstaller failed"
              echo '```'
              tail -80 pyi.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          if [ ! -f "$ROOT/backend-dist/ghtrend-server/ghtrend-server.exe" ]; then
            {
              echo "### ❌ executable missing"
              echo '```'
              find "$ROOT/backend-dist" -maxdepth 2 | head -40
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "backend ok"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Electron deps
        working-directory: electron
        shell: bash
        # 仓库里的 .npmrc 指向 npmmirror（给国内用户加速），
        # GitHub 美国 runner 上访问国内镜像反而慢/超时，这里删掉走官方源。
        run: |
          rm -f .npmrc
          npm ci --no-audit --no-fund
          npx electron --version

      - name: Package desktop app
        working-directory: electron
        run: npm run dist -- --publish never

      - name: List output
        run: ls -l dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GHTrend-windows-x64
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.zip
          generate_release_notes: true
