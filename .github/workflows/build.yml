name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python --version

      # 注意：--specpath 会让 --icon / --add-data 的相对路径按 spec 目录解析，
      # 因此这里一律传绝对路径（$ROOT）。
      - name: Build Python backend
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$(pwd -W 2>/dev/null || pwd)"
          echo "ROOT=$ROOT"
          python tools/make_icon.py
          ls -l "$ROOT/electron/build/icon.ico"
          python -m PyInstaller --noconfirm --clean --log-level WARN \
            --name ghtrend-server --onedir --noconsole \
            --icon "$ROOT/electron/build/icon.ico" \
            --add-data "$ROOT/web;web" \
            --distpath "$ROOT/backend-dist" \
            --workpath "$ROOT/build/pyinstaller" \
            --specpath "$ROOT/build" \
            "$ROOT/server.py"
          test -f "$ROOT/backend-dist/ghtrend-server/ghtrend-server.exe"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Electron deps
        working-directory: electron
        run: npm ci

      - name: Package desktop app
        working-directory: electron
        run: npm run dist -- --publish never

      - name: List output
        run: ls -l dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GHTrend-windows-x64
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.zip
          generate_release_notes: true
